name: build-test
on:
  push:
    branches: [develop]
  pull_request:
  merge_group:

jobs:
  build:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.actor != 'github-merge-queue[bot]')
    runs-on: ubuntu-latest
    container: lazerson/stellopt-compile:latest
    env:
      MACHINE: debian
      STELLOPT_PATH: ${{ github.workspace }}
      MYHOME: ${{ github.workspace }}/bin
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - name: checkout sources
        uses: actions/checkout@master
      - name: set safe directory
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          chown -R "$(id -u):$(id -g)" .
      - name: compile
        run: |
          cd "${STELLOPT_PATH}"
          # THRIFT only tracks its Release build directory.
          mkdir -p THRIFT/Debug
          ln -sfn ../makethrift THRIFT/Debug/makethrift
          # The current module dependency graph is not safe for parallel make.
          sh -e ./build_all -o clean_debug -j 1
      - name: unit_test
        run: python3 -m unittest discover -s BENCHMARKS/tests -v
      - name: test
        run: |
          mpiexec ./bin/xstelloptv2 test -h
